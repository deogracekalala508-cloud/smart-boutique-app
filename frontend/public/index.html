<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Smart Boutique - Application de gestion commerciale et stocks. Installez l'application pour un accès rapide même hors ligne." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartBoutique" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Smart Boutique - Gestion Commerciale</title>
    <script>
      // Récupération automatique si une ancienne version du JS ou du Service Worker cause un écran blanc
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Ressource obsolète en cache détectée. Nettoyage et rechargement...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (var name of names) caches.delete(name);
                  window.location.reload(true);
                });
              } else {
                window.location.reload(true);
              }
            });
          }
        }
      }, true);
    </script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0; background-color: #0f172a; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased;">
    <noscript>Vous devez activer JavaScript pour utiliser Smart Boutique.</noscript>
    <div id="root"></div>
    <script>
      function generateAndCacheIcon(size) {
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#4f46e5');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        var r = size * 0.2;
        ctx.beginPath();
        ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold ' + Math.round(size * 0.5) + 'px Inter, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('SB', size / 2, size / 2);
        return canvas.toDataURL('image/png');
      }
    </script>
  </body>
</html>
